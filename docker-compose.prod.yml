services:
  postgres:
    image: postgres:16-alpine
    container_name: flextrip_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flextrip
      POSTGRES_PASSWORD: Flextrip@2026!
      POSTGRES_DB: flextrip_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 128mb

  redis:
    image: redis:7-alpine
    container_name: flextrip_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
